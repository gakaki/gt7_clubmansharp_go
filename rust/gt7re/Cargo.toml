[package]
name = "gt7re"
version = "0.1.0"
edition = "2021"
description = "Parallel Gran Turismo 7 (PS5) content-store parser, extractor and RT2 decoder"
license = "MIT"

[dependencies]
anyhow = "1"
bcdec_rs = "0.2"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
flate2 = "1"
zstd = "0.13"
walkdir = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
